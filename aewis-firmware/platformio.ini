; AEWIS Firmware — PlatformIO project config  (v1.2)
[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Flash/RAM settings for ESP32-S3
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    ; Connectivity
    knolleary/PubSubClient @ ^2.8

    ; Sensors
    sensirion/Sensirion I2C SCD4x @ ^0.4.0
    sensirion/Sensirion I2C SGP41 @ ^0.1.0
    sensirion/Sensirion Gas Index Algorithm @ ^3.2.2

    ; BMV080 particulate matter sensor
    ; TODO: Uncomment when the Bosch SensorTec BMV080 library lands on PlatformIO
    ; registry, or point to the local path after cloning:
    ;   https://github.com/boschsensortec/BMV080_SensorAPI
    ; boschsensortec/BMV080-Sensor-API @ ^1.0.0
    ; Until then the stub in main.cpp returns -1 (sent as null to backend).

    ; Display
    zinggjm/GxEPD2 @ ^1.5.8

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0   ; MUST be 0 — firmware uses UART0 for Serial
    ; Set to 1 ONLY during development to wipe NVS on every boot.
    ; MUST be 0 in production — device cannot reconnect after reboot if 1.
    -DALWAYS_CLEAR_NVS=0
