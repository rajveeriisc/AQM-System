; AEWIS Firmware — PlatformIO project config
[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Flash/RAM settings for ESP32-S3
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    ; Connectivity  (NEW in v1.1)
    knolleary/PubSubClient @ ^2.8

    ; Sensors
    sensirion/Sensirion I2C SCD4x @ ^0.4.0
    sensirion/Sensirion I2C SGP41 @ ^0.1.0
    sensirion/Sensirion Gas Index Algorithm @ ^3.2.2

    ; Display
    zinggjm/GxEPD2 @ ^1.5.8

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0   ; MUST be 0 — firmware uses UART0 for Serial
