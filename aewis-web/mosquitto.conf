# Mosquitto config for AEWIS
# Listen on all interfaces so the ESP32 can reach this broker over LAN
listener 1883 0.0.0.0

# Allow unauthenticated connections (local network only — keep firewall on)
allow_anonymous true

# Increase max payload for safety (default 268 MB is fine, but explicit is clearer)
max_packet_size 65536

# Keep logs minimal
log_type error
log_type warning
