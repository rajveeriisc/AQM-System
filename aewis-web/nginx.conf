upstream aewis_backend {
    server 127.0.0.1:3000;
    # Add more servers here only after adding Redis socket.io adapter + separate MQTT worker
}

server {
    listen 80;
    server_name app.aewis.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.aewis.in;

    ssl_certificate     /etc/letsencrypt/live/app.aewis.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.aewis.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # Serve React frontend (vite build output)
    root /var/www/aewis/frontend/dist;
    index index.html;
    try_files $uri $uri/ /index.html;

    # Cache static assets
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to Node.js
    location /api/ {
        proxy_pass http://aewis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Proxy Socket.io — must keep long-lived connection alive
    location /socket.io/ {
        proxy_pass http://aewis_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;   # keep alive for 24h (socket.io heartbeat handles keepalive)
        proxy_send_timeout 86400s;
    }
}
